name: Refresh Actions Lock

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Generate lockfile
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          gh auth setup-git
          gh repo clone "$GITHUB_REPOSITORY" repo -- --branch main
          gh extension install github/gh-actions-lock
          cd repo
          gh actions-lock
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/actions.lock
          if git diff --cached --quiet; then
            echo "Lockfile is already up to date."
          else
            git commit -m "Generate GitHub Actions dependency lockfile"
            git push origin main
          fi
