name: Refresh Actions Lock

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Generate lockfile
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          gh repo clone "$GITHUB_REPOSITORY" repo -- --branch main
          gh extension install github/gh-actions-lock
          cd repo
          gh actions-lock
          echo BISHO_LOCK_BEGIN
          base64 -w0 .github/workflows/actions.lock
          echo
          echo BISHO_LOCK_END
