name: Build Flutter APK

on:
  workflow_dispatch:
    inputs:
      flutter_version:
        description: 'Flutter stable version'
        required: true
        default: '3.47.2'

permissions:
  contents: read

concurrency:
  group: bisho-ide-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-build:
    name: Validate and build one release APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ github.event.inputs.flutter_version || '3.47.2' }}
          channel: stable
          cache: true

      - name: Show toolchain versions
        run: |
          flutter --version
          dart --version
          java -version

      - name: Cache pub packages
        uses: actions/cache@v5
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Resolve dependencies
        run: flutter pub get

      - name: Validate Android project files
        run: |
          test -f android/settings.gradle
          test -f android/app/build.gradle
          test -f android/app/src/main/AndroidManifest.xml
          test -f android/gradle/wrapper/gradle-wrapper.jar
          test -f android/gradle/wrapper/gradle-wrapper.properties
          test -f android/gradlew
          test -f android/gradlew.bat
          test -f android/app/src/main/kotlin/com/bisho/myapp/MainActivity.kt
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          ET.parse('android/app/src/main/AndroidManifest.xml')
          ET.parse('android/app/src/main/res/values/styles.xml')
          PY

      - name: Analyze Dart source
        run: flutter analyze --no-pub --no-fatal-infos

      - name: Run unit and widget tests
        run: flutter test --no-pub --reporter expanded

      - name: Build universal release APK
        run: flutter build apk --release --no-pub

      - name: Verify APK output
        run: |
          APK='build/app/outputs/flutter-apk/app-release.apk'
          test -s "$APK"
          ls -lh "$APK"
          sha256sum "$APK" | tee build/app/outputs/flutter-apk/SHA256SUMS.txt

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: Bisho-IDE-Release-APK
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
