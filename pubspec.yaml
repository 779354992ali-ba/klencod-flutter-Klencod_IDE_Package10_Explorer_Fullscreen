
name: bisho_ide
description: A professional multi-language mobile code editor.
publish_to: 'none'
version: 1.0.0+67

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  archive: ^4.0.7

  shared_preferences: ^2.2.2
  flutter_code_editor: ^0.3.3
  highlight: ^0.7.0
  flutter_highlight: ^0.7.0
  file_picker: ^10.3.3
  path_provider: ^2.1.5
  permission_handler: ^12.0.1

  saf: ^2.1.2
  webview_flutter: ^4.14.1
  markdown: ^7.3.0
  xml: ^6.5.0
  yaml: ^3.1.3
  http: ^1.2.2
  url_launcher: ^6.3.2
  flutter_secure_storage: ^9.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/templates/android/gradle/wrapper/gradle-wrapper.jar
    - assets/templates/android/gradlew
    - assets/templates/android/gradlew.bat